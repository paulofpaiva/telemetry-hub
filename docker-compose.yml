name: telemetry-hub

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_PORT}:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  questdb:
    image: questdb/questdb:10.2.0
    environment:
      QDB_PG_USER: ${QUESTDB_USER}
      QDB_PG_PASSWORD: ${QUESTDB_PASSWORD}
      QDB_TELEMETRY_ENABLED: "false"
    volumes:
      - questdb-data:/var/lib/questdb
    ports:
      - "${QUESTDB_HTTP_PORT}:9000"
      - "${QUESTDB_PG_PORT}:8812"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local development.
  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-data:/data
    ports:
      - "${S3_API_PORT}:9000"
      - "${S3_CONSOLE_PORT}:9001"

  # One-shot job that creates the archive bucket once the S3 endpoint answers.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_SERVICE_URL: ${S3_SERVICE_URL}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          if aws --endpoint-url "$$S3_SERVICE_URL" s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null; then
            echo "bucket $$S3_BUCKET already exists"; exit 0
          fi
          if aws --endpoint-url "$$S3_SERVICE_URL" s3api create-bucket --bucket "$$S3_BUCKET"; then
            echo "bucket $$S3_BUCKET created"; exit 0
          fi
          echo "waiting for S3 endpoint ($$attempt/30)"; sleep 2
        done
        echo "could not create bucket $$S3_BUCKET"; exit 1

  api:
    build:
      context: .
      dockerfile: src/TelemetryHub.Api/Dockerfile
    depends_on:
      mosquitto:
        condition: service_healthy
      questdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: "8080"
      Logging__Console__FormatterName: json
      Mqtt__Host: ${MQTT_HOST}
      Mqtt__Port: ${MQTT_PORT}
      Mqtt__Username: ${MQTT_USERNAME}
      Mqtt__Password: ${MQTT_PASSWORD}
      Mqtt__TopicPrefix: ${MQTT_TOPIC_PREFIX}
      Mqtt__ClientId: ${MQTT_CLIENT_ID}
      QuestDb__Host: ${QUESTDB_HOST}
      QuestDb__HttpPort: ${QUESTDB_HTTP_PORT}
      QuestDb__PgPort: ${QUESTDB_PG_PORT}
      QuestDb__Username: ${QUESTDB_USER}
      QuestDb__Password: ${QUESTDB_PASSWORD}
      QuestDb__Database: ${QUESTDB_DATABASE}
      Postgres__Host: ${POSTGRES_HOST}
      Postgres__Port: ${POSTGRES_PORT}
      Postgres__Database: ${POSTGRES_DB}
      Postgres__Username: ${POSTGRES_USER}
      Postgres__Password: ${POSTGRES_PASSWORD}
      S3__ServiceUrl: ${S3_SERVICE_URL}
      S3__ForcePathStyle: ${S3_FORCE_PATH_STYLE}
      S3__Region: ${S3_REGION}
      S3__Bucket: ${S3_BUCKET}
      S3__AccessKey: ${S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY}
      Archive__IntervalSeconds: ${ARCHIVE_INTERVAL_SECONDS}
      Archive__WindowMinutes: ${ARCHIVE_WINDOW_MINUTES}
      Archive__GraceSeconds: ${ARCHIVE_GRACE_SECONDS}
    ports:
      - "${API_PORT}:8080"

  simulator:
    build:
      context: .
      dockerfile: src/TelemetryHub.Simulator/Dockerfile
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Logging__Console__FormatterName: json
      Mqtt__Host: ${MQTT_HOST}
      Mqtt__Port: ${MQTT_PORT}
      Mqtt__Username: ${MQTT_USERNAME}
      Mqtt__Password: ${MQTT_PASSWORD}
      Mqtt__TopicPrefix: ${MQTT_TOPIC_PREFIX}
      Simulator__DeviceCount: ${SIMULATOR_DEVICE_COUNT}
      Simulator__IntervalMs: ${SIMULATOR_INTERVAL_MS}

volumes:
  questdb-data:
  postgres-data:
  rustfs-data:
