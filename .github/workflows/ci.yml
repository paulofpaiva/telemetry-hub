name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/TelemetryHub.UnitTests --no-build --configuration Release --logger "console;verbosity=normal"

      # Testcontainers starts PostgreSQL, QuestDB, Mosquitto and the S3 store on the runner's Docker.
      - name: Integration tests
        run: dotnet test tests/TelemetryHub.IntegrationTests --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
